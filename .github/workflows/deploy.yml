name: Deploy Angular a GitHub Pages

on:
  push:
    branches:
      - main  # Se activa al subir cambios a main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Instalar dependencias
        run: npm install

      - name: Compilar proyecto
        run: npm run build -- --configuration=production

      - name: Desplegar
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist/TU_PROYECTO/browser # Revisa el nombre exacto en tu carpeta dist
          branch: gh-pages # Rama donde se guardará la web compilada